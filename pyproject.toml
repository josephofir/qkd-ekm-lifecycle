[project]
name = "qkd-ekm-lifecycle"
version = "0.1.0"
description = "Reproducibility package: resilient external-key lifecycle for QKD-supported cloud KMS"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "pydantic>=2",
  "cryptography>=42", "google-auth>=2.30", "google-cloud-storage>=2.17",
  "python-multipart>=0.0.9",
  "google-cloud-kms>=2.24", "typer>=0.12", "PyJWT>=2.8",
  "pandas>=2.2", "numpy>=1.26", "matplotlib>=3.8",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
[project.scripts]
qkd-ekm-ekm = "qkd_ekm.ekm.__main__:main"
qkd-ekm-vpn = "qkd_ekm.vpn.__main__:main"
qkd-ekm-upload = "qkd_ekm.upload.__main__:main"
qkd-ekm-qkdsim = "qkd_ekm.qkdsim.__main__:main"
qkd-ekm-client = "qkd_ekm.client.cli:main"
qkd-ekm-rotate = "qkd_ekm.ekm.rotate:main"
qkd-ekm-model = "qkd_ekm.model.__main__:main"
qkd-ekm-analysis = "qkd_ekm.analysis.__main__:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/qkd_ekm"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
